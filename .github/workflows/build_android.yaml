name: Build RP Duo APK

on:
  workflow_dispatch:
  push:
    branches: [rp-duo]
    paths: ['Android/**', '.github/workflows/build_android.yaml']
  pull_request:
    branches: [rp-duo]
    paths: ['Android/**', '.github/workflows/build_android.yaml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build development APK
        working-directory: Android/src
        run: ./gradlew --console=plain :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-rp-duo-development
          path: Android/src/app/build/outputs/apk/debug/app-debug.apk
